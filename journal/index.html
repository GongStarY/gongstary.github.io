<!DOCTYPE html>
<html lang="zh-CN" data-theme="scifi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>日志台 // KUNG Hsinyü</title>
<style>
@font-face { font-family:'Tektur'; src:url('../_shared/fonts/Tektur-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:'Tektur'; src:url('../_shared/fonts/Tektur-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'JetBrainsMono'; src:url('../_shared/fonts/JetBrainsMono-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
@font-face { font-family:'JetBrainsMono'; src:url('../_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'Outfit'; src:url('../_shared/fonts/Outfit-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
@font-face { font-family:'Outfit'; src:url('../_shared/fonts/Outfit-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }

:root,html[data-theme="scifi"]{
  --bg:#05070f;--bg2:#0b1020;--bg3:#111830;
  --ink:#e6f1ff;--muted:#6b7a99;--rule:#1a2845;
  --accent:#00f0ff;--accent2:#7b5cff;--accent3:#ff2d75;
  --ok:#00ff88;--title:#fff;--side-bg:linear-gradient(180deg,rgba(11,16,32,.95),rgba(5,7,15,.92));
  --nav-bg:rgba(5,7,15,.9);--code-bg:#080c18;--code-ink:#d6e8ff;
  --card-bg:rgba(11,16,32,.7);--menu-bg:#0c1428;--hover:rgba(0,240,255,.12);
  --paper:transparent;--glow-cyan:0 0 20px rgba(0,240,255,.45);
  --side:272px;--ui-radius:6px;--font:'Outfit',-apple-system,'Microsoft YaHei',sans-serif;
}
html[data-theme="notion"]{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#ffffff;
  --ink:#37352f;--muted:#787774;--rule:#e9e9e7;
  --accent:#2383e2;--accent2:#6940a5;--accent3:#eb5757;
  --ok:#0f7b6c;--title:#37352f;--side-bg:#f7f6f3;
  --nav-bg:#ffffff;--code-bg:#f7f6f3;--code-ink:#37352f;
  --card-bg:#fff;--menu-bg:#fff;--hover:rgba(55,53,47,.08);
  --paper:none;--glow-cyan:none;--ui-radius:4px;
  --font:ui-sans-serif,system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
html[data-theme="parchment"]{
  --bg:#e4d5b7;--bg2:#d7c4a3;--bg3:#efe4cc;
  --ink:#3b2a1a;--muted:#7a6550;--rule:#c4ad8a;
  --accent:#8b5a2b;--accent2:#6b4a32;--accent3:#9a3b2f;
  --ok:#4d6b3a;--title:#2c1c10;--side-bg:#d2c09a;
  --nav-bg:#cbb892;--code-bg:#efe4cc;--code-ink:#3b2a1a;
  --card-bg:#efe6d0;--menu-bg:#efe4cc;--hover:rgba(139,90,43,.12);
  --paper:repeating-linear-gradient(0deg,rgba(90,60,30,.04) 0 1px,transparent 1px 7px);
  --glow-cyan:none;--ui-radius:2px;
  --font:Georgia,'Songti SC','Noto Serif SC','Microsoft YaHei',serif;
}
html[data-theme="eyecare"]{
  --bg:#e8f2e4;--bg2:#dcead6;--bg3:#f3f8f1;
  --ink:#24362a;--muted:#5d7264;--rule:#c5d6c0;
  --accent:#3d7a4a;--accent2:#2f6f5e;--accent3:#b85c38;
  --ok:#2f7d45;--title:#1c2e22;--side-bg:#d5e6cf;
  --nav-bg:#e8f2e4;--code-bg:#f3f8f1;--code-ink:#24362a;
  --card-bg:#f4faf2;--menu-bg:#f3f8f1;--hover:rgba(61,122,74,.12);
  --paper:none;--glow-cyan:none;--ui-radius:8px;
  --font:'Outfit',-apple-system,'Microsoft YaHei',sans-serif;
}
html[data-theme="vista"]{
  --bg:#9ec9ea;--bg2:#c5dff3;--bg3:#eef6fc;
  --ink:#16324d;--muted:#4d6f8a;--rule:#7eb0d4;
  --accent:#0a64a8;--accent2:#3b6ea5;--accent3:#c45c12;
  --ok:#1a7f3c;--title:#102a44;--side-bg:linear-gradient(180deg,#3a7ebd,#1f5f99);
  --nav-bg:linear-gradient(180deg,#4a8fd0,#215c9a);--code-bg:#f4f9fd;--code-ink:#16324d;
  --card-bg:rgba(255,255,255,.82);--menu-bg:#f4f9fd;--hover:rgba(10,100,168,.14);
  --paper:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
  --glow-cyan:0 0 12px rgba(255,255,255,.45);--ui-radius:8px;
  --font:'Segoe UI','Outfit','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--paper);
}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.navbar{
  position:relative;z-index:40;flex:0 0 56px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:0 1.2rem;background:var(--nav-bg);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.nav-actions{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
a.nav-brand{
  display:inline-flex;align-items:center;gap:.45rem;
  font-family:'Tektur',sans-serif;font-weight:500;font-size:.9rem;letter-spacing:.16em;
  padding:.32rem .8rem;color:var(--accent);
  border:1px solid rgba(0,240,255,.4);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
}
.brand-hint{font-family:'JetBrainsMono',monospace;font-size:.58rem;letter-spacing:.14em;color:var(--muted)}
.nav-status{font-family:'JetBrainsMono',monospace;font-size:.68rem;color:var(--muted)}
.nav-status.ok{color:var(--ok)}
.nav-status.warn{color:#ffcc4d}

.layout{
  display:grid;grid-template-columns:var(--side) 1fr;
  flex:1;min-height:0;
}
.layout,.navbar{position:relative;z-index:1}
.navbar{z-index:40}
.sidebar{
  border-right:1px solid var(--rule);
  background:var(--side-bg);
  display:flex;flex-direction:column;min-width:0;
  color:var(--ink);
}
html[data-theme="vista"] .sidebar{color:#f4fbff}
html[data-theme="vista"] .sidebar .note-item{color:#f4fbff}
html[data-theme="vista"] .sidebar .side-foot,html[data-theme="vista"] .sidebar .note-item .m{color:rgba(244,251,255,.72)}
html[data-theme="vista"] .navbar,html[data-theme="vista"] .nav-brand,html[data-theme="vista"] .nav-status,html[data-theme="vista"] .brand-hint{color:#f4fbff}
.side-head{padding:.9rem .85rem .55rem;display:flex;gap:.4rem;flex-wrap:wrap}
.side-search{
  margin:0 .85rem .7rem;padding:.45rem .6rem;width:calc(100% - 1.7rem);
  background:var(--bg);border:1px solid var(--rule);border-radius:4px;
  font-family:'Outfit',sans-serif;font-size:.82rem;
}
.note-list{flex:1;overflow:auto;padding:0 .55rem 1rem}
.note-item{
  display:block;width:100%;text-align:left;background:transparent;
  border:1px solid transparent;padding:.55rem .6rem;margin:0 0 .35rem;
  cursor:pointer;border-radius:6px;color:var(--ink);
}
.note-item:hover{border-color:var(--rule);background:var(--hover)}
.note-item.active{border-color:var(--accent);background:var(--hover)}
.note-item .t{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .m{font-family:'JetBrainsMono',monospace;font-size:.62rem;color:var(--muted);margin-top:.15rem}
.side-foot{padding:.7rem .85rem;border-top:1px solid var(--rule);font-size:.68rem;color:var(--muted);line-height:1.45}

.workspace{display:flex;flex-direction:column;min-width:0;height:100%}
.toolbar{
  display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;
  padding:.45rem .9rem;border-bottom:1px solid var(--rule);
  background:var(--bg2);
}
.btn{
  font-family:'JetBrainsMono',monospace;font-size:.66rem;letter-spacing:.06em;
  padding:.42rem .7rem;border:1px solid var(--accent);color:var(--accent);
  background:transparent;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--accent);color:var(--bg)}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.sep{width:1px;height:18px;background:var(--rule);margin:0 .15rem}
.grow{flex:1}
.hint-bar{font-size:.72rem;color:var(--muted);margin-left:.4rem}

.editor-scroll{flex:1;overflow:auto;padding:1.4rem 4% 4rem}
.page{
  max-width:820px;margin:0 auto;
}
.meta-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.4rem}
.meta-row label{font-family:'JetBrainsMono',monospace;font-size:.62rem;color:var(--accent);letter-spacing:.12em;display:flex;flex-direction:column;gap:.3rem;flex:1;min-width:180px}
.meta-row input{
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:.35rem 0;font-size:1rem;outline:none;
}
#note-title{
  width:100%;background:transparent;border:0;outline:none;
  font-family:var(--font);font-weight:700;font-size:2.05rem;
  line-height:1.25;margin:.2rem 0 .9rem;color:var(--title);
}
.blocks{min-height:40vh;padding-left:.2rem}
.block{
  position:relative;display:flex;gap:.35rem;align-items:flex-start;
  margin:1px 0;padding:2px 0 2px 52px;
  transition:margin-left .15s ease;
}
.block[data-indent="1"]{margin-left:1.55rem}
.block[data-indent="2"]{margin-left:3.1rem}
.block[data-indent="3"]{margin-left:4.65rem}
.block[data-indent="4"]{margin-left:6.2rem}
.block[data-indent="5"]{margin-left:7.75rem}
.block[data-indent="6"]{margin-left:9.3rem}
.block[data-indent="7"]{margin-left:10.85rem}
.block[data-indent="8"]{margin-left:12.4rem}
.block.is-folded{display:none}
.block:hover .grip,.block:focus-within .grip,
.block:hover .plus,.block:focus-within .plus{opacity:1}
.tri{
  flex:0 0 22px;width:22px;height:22px;margin-top:.2rem;padding:0;border:0;border-radius:4px;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.tri:hover{background:var(--hover);color:var(--ink)}
.tri i{
  display:block;width:0;height:0;
  border-style:solid;border-width:5px 0 5px 7px;
  border-color:transparent transparent transparent currentColor;
  transform:rotate(0deg);transform-origin:3px 5px;
  transition:transform .16s ease;
}
.block.toggle .tri[aria-expanded="true"] i{transform:rotate(90deg);color:var(--accent)}
.toggle-row{display:flex;align-items:flex-start;gap:.4rem;width:100%}
.plus,.grip{
  position:absolute;top:.32rem;opacity:0;cursor:pointer;
  width:22px;height:22px;border:0;border-radius:4px;
  background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.plus{left:2px;font-size:1.15rem;line-height:1;font-weight:500}
.plus:hover,.grip:hover{background:var(--hover);color:var(--ink)}
.grip{left:26px;cursor:grab}
.grip-dots{
  display:grid;grid-template-columns:repeat(2,3px);gap:2px;
  width:8px;height:14px;
}
.grip-dots i{width:3px;height:3px;border-radius:50%;background:currentColor;display:block}
.ce,.code-area,select.lang{
  width:100%;background:transparent;border:0;outline:none;resize:none;
  line-height:1.7;font-size:1rem;
}
.ce[data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--muted);opacity:.55}
.h1 .ce{font-size:1.6rem;font-weight:700}
.h2 .ce{font-size:1.3rem;font-weight:700}
.h3 .ce{font-size:1.12rem;font-weight:600}
.check-row,.radio-row{display:flex;align-items:flex-start;gap:.55rem;width:100%}
.check-row input,.radio-row input{margin-top:.45rem;accent-color:var(--accent);width:16px;height:16px}
.code-wrap{
  width:100%;background:var(--code-bg);border:1px solid var(--rule);border-radius:var(--ui-radius);padding:.55rem .7rem .7rem;
}
.code-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.35rem}
select.lang{width:auto;color:var(--muted);font-family:'JetBrainsMono',monospace;font-size:.72rem}
.code-area{
  font-family:'JetBrainsMono',monospace;font-size:.82rem;min-height:4.5rem;color:var(--code-ink);white-space:pre;
}
.quote .ce{border-left:3px solid var(--accent2);padding-left:.8rem;color:var(--ink);font-style:italic;opacity:.92}
.callout .ce{
  background:var(--hover);border:1px solid var(--rule);
  border-radius:var(--ui-radius);padding:.7rem .85rem;
}
.hr-line{width:100%;height:1px;background:var(--rule);margin:.8rem 0}
.link-card{
  display:grid;grid-template-columns:1fr 120px;gap:.8rem;width:100%;
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  background:var(--card-bg);text-align:left;cursor:pointer;color:inherit;
}
.link-card .info{padding:.8rem .9rem}
.link-card .host{font-family:'JetBrainsMono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:.25rem}
.link-card .lt{font-weight:600;font-size:.95rem}
.link-card .ld{font-size:.78rem;color:var(--muted);margin-top:.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.link-card img{width:120px;height:100%;object-fit:cover;background:#0a1020;min-height:88px}
.img-block{width:100%}
.img-block img{max-width:100%;border-radius:8px;border:1px solid var(--rule);display:block}
.img-cap{margin-top:.35rem;font-size:.8rem;color:var(--muted)}
.empty-editor{color:var(--muted);padding:2rem 0;font-size:.9rem}

.slash,.insert-menu{
  position:fixed;z-index:80;width:324px;max-height:420px;overflow:auto;
  background:var(--menu-bg);border:1px solid var(--rule);border-radius:10px;
  box-shadow:0 14px 40px rgba(15,15,15,.16);padding:6px;
  color:var(--ink);
}
.slash button,.insert-menu button.insert-item{
  display:flex;width:100%;text-align:left;background:transparent;border:0;
  color:var(--ink);padding:6px;cursor:pointer;border-radius:8px;align-items:flex-start;gap:10px;
}
.slash button{display:block;padding:.45rem .55rem;border-radius:5px;font-size:.85rem;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);cursor:pointer}
.slash button:hover,.insert-menu button.insert-item:hover,.slash button.active{background:var(--hover)}
.slash .k{color:var(--muted);font-family:'JetBrainsMono',monospace;font-size:.62rem;float:right;margin-top:.15rem}
.insert-menu .lab{font-size:.68rem;color:var(--muted);padding:8px 8px 4px;letter-spacing:.04em;font-weight:600}
.insert-ico{
  width:46px;height:46px;flex:0 0 46px;border:1px solid var(--rule);border-radius:6px;
  background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.insert-ico svg{width:22px;height:22px;display:block}
.insert-txt{min-width:0;padding-top:2px}
.insert-txt .n{display:block;font-size:.88rem;font-weight:600;line-height:1.3}
.insert-txt .d{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.35}

.modal{
  display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  align-items:center;justify-content:center;padding:1rem;
}
.modal.show{display:flex}
.modal-card{
  width:min(520px,100%);background:var(--bg2);border:1px solid var(--rule);
  padding:1.3rem 1.2rem;border-radius:var(--ui-radius);
}
.modal-card h2{font-family:'Tektur',sans-serif;font-size:1.15rem;margin:.2rem 0 .7rem}
.modal-card p{font-size:.8rem;color:var(--muted);margin-bottom:.8rem;line-height:1.55}
.modal-card label{display:block;font-size:.72rem;color:var(--accent);margin:.45rem 0 .2rem;font-family:'JetBrainsMono',monospace}
.modal-card input{
  width:100%;padding:.55rem .65rem;background:var(--bg);border:1px solid var(--rule);
}
.toast{
  position:fixed;bottom:18px;right:18px;z-index:100;
  background:var(--menu-bg);border:1px solid var(--accent);color:var(--ink);
  padding:.55rem .8rem;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
.hidden-file{position:absolute;width:0;height:0;opacity:0}

.theme-dock{
  position:fixed;left:14px;bottom:14px;z-index:95;
  display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;
}
.theme-toggle{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--rule);background:var(--menu-bg);color:var(--ink);
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);
  font-size:.72rem;letter-spacing:.04em;
}
.theme-list{
  display:flex;flex-direction:column;gap:4px;
  background:var(--menu-bg);border:1px solid var(--rule);border-radius:10px;
  padding:6px;min-width:196px;
  box-shadow:0 10px 28px rgba(0,0,0,.16);
}
.theme-list button{
  display:flex;align-items:center;gap:.5rem;
  text-align:left;border:1px solid transparent;background:transparent;
  color:var(--ink);padding:.42rem .5rem;border-radius:7px;cursor:pointer;font-size:.78rem;
}
.theme-list button:hover,.theme-list button.active{background:var(--hover);border-color:var(--rule)}
.theme-list .swatch{
  width:16px;height:16px;border-radius:50%;border:1px solid var(--rule);flex:0 0 16px;
}
html[data-theme="notion"] a.nav-brand{clip-path:none;border-radius:4px;color:var(--accent)}
html[data-theme="parchment"] a.nav-brand,html[data-theme="eyecare"] a.nav-brand,html[data-theme="vista"] a.nav-brand{clip-path:none;border-radius:6px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:30;inset:56px auto 0 0;width:min(86vw,var(--side));transform:translateX(-102%);transition:transform .25s}
  .sidebar.open{transform:none}
  .link-card{grid-template-columns:1fr}
  .link-card img{width:100%;height:120px}
}
</style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="nav-brand">KUNG_HSINYÜ<span class="brand-hint">HOME</span></a>
  <div class="nav-actions">
    <span class="nav-status" id="sync-status">本地草稿</span>
    <button class="btn ghost" type="button" id="btn-export-md">导出 MD</button>
    <button class="btn ghost" type="button" id="btn-export-html">导出 HTML</button>
    <button class="btn" type="button" id="btn-save">保存到仓库</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="btn" type="button" id="btn-new">新建日志</button>
      <button class="btn ghost" type="button" id="btn-settings">仓库设置</button>
    </div>
    <input class="side-search" id="note-search" placeholder="搜索标题 / 作者">
    <div class="note-list" id="note-list"></div>
    <div class="side-foot">Ctrl+Shift 点击首页「开往」可进入本页。正文写入 GitHub 仓库的 journal/notes，优先选更小的 Markdown。</div>
  </aside>

  <main class="workspace">
    <div class="toolbar">
      <button class="btn ghost" type="button" id="btn-sidebar">目录</button>
      <span class="hint-bar" id="editor-hint">悬停行首：＋ 插入 · 六点拖动 · 折叠列表才有三角</span>
    </div>
    <div class="editor-scroll" id="scroller">
      <div class="page" id="empty-hint">
        <p class="empty-editor">从左侧新建一篇日志，或在仓库设置里填入 GitHub Token 后拉取已有笔记。</p>
      </div>
      <div class="page" id="editor" hidden>
        <div class="meta-row">
          <label>AUTHOR<input id="note-author" placeholder="作者"></label>
        </div>
        <input id="note-title" placeholder="无标题">
        <div class="blocks" id="blocks"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-card">
    <h2>GitHub 仓库</h2>
    <p>用 Fine-grained 或 classic PAT（contents:read/write）把日志写成仓库里的 .md / .html。Token 只存在这台浏览器，不会写进笔记文件。</p>
    <label>Owner</label>
    <input id="cfg-owner" placeholder="例如 gongstary">
    <label>Repository</label>
    <input id="cfg-repo" placeholder="例如 gongstary.github.io">
    <label>Branch（可空，自动检测）</label>
    <input id="cfg-branch" placeholder="main">
    <label>目录</label>
    <input id="cfg-path" placeholder="journal/notes">
    <label>Personal Access Token</label>
    <input id="cfg-token" type="password" autocomplete="off" placeholder="ghp_…">
    <div style="display:flex;gap:.5rem;margin-top:1rem">
      <button class="btn" type="button" id="cfg-save">保存并拉取</button>
      <button class="btn ghost" type="button" id="cfg-close">关闭</button>
    </div>
  </div>
</div>

<div class="theme-dock" id="theme-dock">
  <div class="theme-list" id="theme-list" hidden>
    <button type="button" data-theme="notion"><span class="swatch" style="background:#fff;box-shadow:inset 0 0 0 1px #ddd"></span>经典 Notion 白</button>
    <button type="button" data-theme="parchment"><span class="swatch" style="background:#d7c4a3"></span>羊皮纸复古</button>
    <button type="button" data-theme="eyecare"><span class="swatch" style="background:#cfe6c8"></span>浅绿色护眼</button>
    <button type="button" data-theme="vista"><span class="swatch" style="background:#6eb0e0"></span>Vista 淡蓝</button>
    <button type="button" data-theme="scifi"><span class="swatch" style="background:#05070f"></span>主页科幻黑</button>
  </div>
  <button class="theme-toggle" type="button" id="theme-toggle" title="风格">风格</button>
</div>
<input class="hidden-file" id="img-file" type="file" accept="image/*">
<div class="slash" id="slash" hidden></div>
<div class="insert-menu" id="insert-menu" hidden></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
